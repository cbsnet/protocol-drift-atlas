[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-drift-atlas"
version = "0.1.0"
description = "An open toolkit for measuring protocol sensitivity in LLM safety judgments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Antonello Sale" }
]
keywords = [
    "llm",
    "evaluation",
    "ai-safety",
    "llm-as-a-judge",
    "protocol-sensitivity",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.20",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
viz = [
    "matplotlib>=3.8",
]
all = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/cbsnet/protocol-drift-atlas"
Repository = "https://github.com/cbsnet/protocol-drift-atlas"
Issues = "https://github.com/cbsnet/protocol-drift-atlas/issues"

[project.scripts]
pda = "protocol_drift_atlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protocol_drift_atlas = ["prompts/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/protocol_drift_atlas"]
omit = ["tests/*"]